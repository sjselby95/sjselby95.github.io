<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff4e6">
<title>Picture Book Maker</title>
<!--
  PICTURE BOOK MAKER — sticker story toy for a 3-year-old (phone, touch-first)

  How it plays:
  - Tap a sticker in the tray to put it on the page. The phone says its name.
  - Stickers snap into little story moments on their own: tap a crown after an animal and the crown lands
    on its head ("The puffin has a crown!"); tap a boat and the animal hops in ("The otter is in a boat!").
  - Stickers can be dragged anywhere. Dragging two animals together makes them friends. Drag a sticker
    off the page (or onto the trash can that appears) to remove it.
  - A sentence under the page describes the picture. The big pink button reads it aloud, highlighting words.
  - The round buttons at the top change the scene (ocean, snow, night, meadow).
  - Arrows and "+" at the bottom make more pages (up to 6). The book button reads the whole story,
    flipping pages as it goes: "Once upon a time... The end!"
  - Nothing is saved; the book resets when the page is reloaded.

  INTEGRATION NOTES (for Claude Code):
  - This is a TOY. Parent page is /toys.html. Add a card for it there, and place the file
    wherever the other toys linked from /toys.html already live.
  - Fully self-contained: no external fonts, images, audio, scripts, or storage.
  - No in-page back link on purpose (toddler taps). If the other toys link back to /toys.html,
    keep it small and away from the top button row.
  - Voice uses the browser's built-in speechSynthesis; audio unlocks on first tap (iOS requirement).
    Word highlighting uses speech boundary events where the browser supports them.
  - Warm storybook palette on purpose instead of the site's OLED/green theme — it's kid-facing.
-->
<style>
  :root{
    --paper:#fff4e6;
    --ink:#4a3358;
    --pink:#ff6fae;
    --tile:#ffffff;
    --soft:#f3e3d0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    display:flex;flex-direction:column;height:100dvh;
    background:var(--paper);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  button{border:0;background:none;cursor:pointer;font:inherit;color:inherit}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
  button:disabled{opacity:.35;cursor:default}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
  }
  .icon-btn{
    width:50px;height:50px;border-radius:50%;flex:0 0 auto;
    background:#fff;box-shadow:0 3px 10px rgba(120,80,40,.15);
    display:grid;place-items:center;
  }
  .icon-btn svg{width:28px;height:28px}
  .bgs{display:flex;gap:8px}
  .bg-btn{
    width:40px;height:40px;border-radius:50%;
    border:3px solid #fff;box-shadow:0 2px 6px rgba(120,80,40,.18);
    background:var(--c);transition:transform .15s,border-color .15s;
  }
  .bg-btn[aria-pressed="true"]{border-color:var(--pink);transform:scale(1.15)}

  .page-wrap{flex:1;min-height:0;padding:0 12px;display:flex}
  .page{
    position:relative;flex:1;border-radius:26px;overflow:hidden;
    box-shadow:0 6px 18px rgba(120,80,40,.2), inset 0 0 0 4px rgba(255,255,255,.7);
    touch-action:none;
  }
  .page.flip{animation:flip .35s ease-out}
  @keyframes flip{0%{transform:perspective(900px) rotateY(-25deg);opacity:.4}100%{transform:none;opacity:1}}
  .scene{position:absolute;inset:0;width:100%;height:100%}
  #stickers{position:absolute;inset:0}

  .sticker{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab}
  .sticker .art{width:100%;height:100%;animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
  .sticker svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 2px rgba(60,40,30,.25))}
  .sticker.dragging .art{transform:scale(1.12)}
  .sticker.wiggle .art{animation:wiggle .45s ease-in-out}
  .sticker.poof .art{animation:poof .3s ease-in forwards}
  @keyframes popIn{0%{transform:scale(.3)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
  @keyframes poof{to{transform:scale(0) rotate(90deg);opacity:0}}

  .trash{
    position:absolute;right:10px;bottom:10px;width:60px;height:60px;border-radius:50%;
    background:rgba(255,255,255,.9);display:grid;place-items:center;
    opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;pointer-events:none;z-index:50
  }
  .trash svg{width:32px;height:32px}
  .trash.show{opacity:1;transform:scale(1)}
  .trash.hot{background:#ffd9e8;transform:scale(1.2)}

  .story{display:flex;align-items:center;gap:12px;padding:10px 14px 4px;min-height:88px}
  .read{
    flex:0 0 auto;width:64px;height:64px;border-radius:50%;
    background:var(--pink);box-shadow:0 4px 0 #d94e8f,0 6px 14px rgba(255,111,174,.35);
    display:grid;place-items:center;transition:transform .1s
  }
  .read:active{transform:translateY(3px);box-shadow:0 1px 0 #d94e8f}
  .read svg{width:34px;height:34px}
  .text{
    flex:1;font-size:17px;line-height:1.35;font-weight:600;
    max-height:92px;overflow-y:auto;touch-action:pan-y
  }
  .text.empty{color:#a58fa8;font-weight:500}
  .text .w{border-radius:6px;padding:0 1px;transition:background .1s}
  .text .w.on{background:#ffe27a}

  .nav{display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 12px 6px}
  .nav .icon-btn{width:44px;height:44px}
  .nav .icon-btn svg{width:24px;height:24px}
  .dots{display:flex;gap:7px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--soft)}
  .dot.on{background:var(--pink);transform:scale(1.25)}

  .tray{
    display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;
    padding:8px 12px calc(12px + env(safe-area-inset-bottom));
    background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 14px rgba(120,80,40,.1)
  }
  .tray::-webkit-scrollbar{display:none}
  .tile{
    flex:0 0 auto;width:74px;height:74px;border-radius:20px;background:var(--paper);
    display:grid;place-items:center;transition:transform .12s
  }
  .tile:active{transform:scale(.9)}
  .tile svg{width:58px;height:58px;overflow:visible}

  .sparkle{position:fixed;width:24px;height:24px;pointer-events:none;z-index:100;animation:sparkle .9s ease-out forwards}
  @keyframes sparkle{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
    30%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(150deg)}
  }

  @media (prefers-reduced-motion: reduce){
    .sticker .art,.page.flip,.sticker.wiggle .art{animation:none}
  }
</style>
</head>
<body>
  <header>

  <div class="story">

        <path d="M5 11h5l6-5v18l-6-5H5z" fill="#fff"/>
        <path d="M20 10.5a6 6 0 0 1 0 9M23.5 7.5a10.5 10.5 0 0 1 0 15"/>
      </svg>
    </button>
    <div class="text empty" id="text" aria-live="polite"></div>
  </div>

  <div class="nav">
    <button class="icon-btn" id="prevBtn" aria-label="Previous page">

    </button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="icon-btn" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="nextIcon" d="M9 5 L16 12 L9 19" stroke="#b05b93" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="tray" id="tray" role="group" aria-label="Stickers"></div>

  ];
  const BY_ID = Object.fromEntries(STICKERS.map((s) => [s.id, s]));

  const SCENES = [
    { id: 'ocean', phrase: 'At the ocean', swatch: 'linear-gradient(180deg,#bfe9ff 50%,#4fb8e3 50%)', svg:
      `<rect width="400" height="300" fill="#bfe9ff"/><circle cx="330" cy="60" r="30" fill="#FFE27A"/>` +

      `<path d="M0,280 Q60,250 140,270 T300,262 T400,270 V300 H0 Z" fill="#f3dca8"/>` },
    { id: 'snow', phrase: 'In the snow', swatch: 'linear-gradient(180deg,#d6ecff 50%,#ffffff 50%)', svg:
      `<rect width="400" height="300" fill="#d6ecff"/>` +
      `<path d="M0,190 Q80,140 170,180 T400,160 V300 H0 Z" fill="#eaf4fb"/>` +

      [[40, 40], [120, 70], [200, 30], [280, 80], [360, 40], [80, 120], [320, 120], [240, 110]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff"/>`).join('') },
    { id: 'night', phrase: 'At night', swatch: 'linear-gradient(180deg,#1f2a5c 50%,#2c3a70 50%)', svg:
      `<rect width="400" height="300" fill="#1f2a5c"/>` +
      [[30, 30], [90, 60], [150, 25], [210, 70], [270, 35], [340, 65], [60, 120], [180, 120], [300, 110], [380, 20]].map(([x, y], i) => `<polygon points="${starPts(x, y, i % 3 ? 3 : 5)}" fill="#FFE27A"/>`).join('') +
      `<path d="M0,220 Q90,180 200,210 T400,195 V300 H0 Z" fill="#2c3a70"/>` },
    { id: 'meadow', phrase: 'In the meadow', swatch: 'linear-gradient(180deg,#cdeeff 50%,#9bdc7a 50%)', svg:

  ];

  // ================= STATE =================
  const MAX_PAGES = 6;
  const MAX_STICKERS = 10;
  let pages = [{ scene: 0, items: [] }];
  let current = 0;
  let uid = 0;
  let soundOn = true;

  const pageEl = document.getElementById('page');
  const sceneEl = document.getElementById('scene');
  const stickersEl = document.getElementById('stickers');
  const trashEl = document.getElementById('trash');
  const textEl = document.getElementById('text');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const nextIcon = document.getElementById('nextIcon');
  const bgsEl = document.getElementById('bgs');
  const trayEl = document.getElementById('tray');

  const page = () => pages[current];
  const pageRect = () => pageEl.getBoundingClientRect();
  const stickerSize = () => {
    const r = pageRect();
    return Math.max(56, Math.min(130, Math.min(r.width, r.height) * 0.27));
  };
  const sizeFor = (def) => stickerSize() * (def.kind === 'prop' ? 0.72 : def.kind === 'place' ? 1.1 : 1);

  // ================= WORDS =================
  const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const lowerFirst = (s) => (s.startsWith('The ') || s.startsWith('A ') || s.startsWith('An ') || s.startsWith('There ')) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const withA = (def) => `${def.a} ${def.name}`;
  const listJoin = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.length === 2 ? `${arr[0]} and ${arr[1]}` : `${arr.slice(0, -1).join(', ')}, and ${arr[arr.length - 1]}`;

  function describe(pg) {
    const out = { sentences: [], byItem: new Map() };
    if (!pg.items.length) return out;
    const r = pageRect();
    const S = stickerSize();
    const px = (it) => ({ x: it.x * r.width, y: it.y * r.height });
    const dist = (a, b) => { const A = px(a), B = px(b); return Math.hypot(A.x - B.x, A.y - B.y); };

    const chars = pg.items.filter((i) => BY_ID[i.type].kind === 'char');
    const props = pg.items.filter((i) => BY_ID[i.type].kind === 'prop');
    const places = pg.items.filter((i) => BY_ID[i.type].kind === 'place');
    const used = new Set();
    const rel = new Map(chars.map((c) => [c, { props: [], place: null }]));
    const typeCount = {};
    chars.forEach((c) => { typeCount[c.type] = (typeCount[c.type] || 0) + 1; });
    const ref = (c) => `${typeCount[c.type] > 1 ? BY_ID[c.type].a : 'the'} ${BY_ID[c.type].name}`;

    props.forEach((p) => {
      let best = null, bd = Infinity;
      chars.forEach((c) => { const d = dist(p, c); if (d < S * 0.8 && d < bd) { best = c; bd = d; } });
      if (best) { rel.get(best).props.push(p); used.add(p); }
    });
    chars.forEach((c) => {
      let best = null, bd = Infinity;
      places.forEach((pl) => { const d = dist(c, pl); if (d < S * 1.05 && d < bd) { best = pl; bd = d; } });
      if (best) { rel.get(c).place = { pl: best, close: bd < S * 0.6 }; used.add(best); }
    });

    const lone = [];
    chars.forEach((c) => {
      const rr = rel.get(c);
      if (!rr.props.length && !rr.place) { lone.push(c); return; }
      const parts = [];
      if (rr.props.length) parts.push('has ' + listJoin(rr.props.map((p) => withA(BY_ID[p.type]))));
      if (rr.place) { const def = BY_ID[rr.place.pl.type]; parts.push(rr.place.close ? def.near : def.by); }
      const s = `${cap(ref(c))} ${parts.join(' and ')}.`;
      out.sentences.push(s);
      used.add(c);
      out.byItem.set(c, s);
      rr.props.forEach((p) => out.byItem.set(p, s));
      if (rr.place) out.byItem.set(rr.place.pl, s);
    });

    const paired = new Set();
    for (let i = 0; i < lone.length; i++) {
      for (let j = i + 1; j < lone.length; j++) {
        const a = lone[i], b = lone[j];
        if (paired.has(a) || paired.has(b)) continue;
        if (dist(a, b) < S * 1.2) {
          const s = `${cap(ref(a))} and ${ref(b)} are friends.`;
          out.sentences.push(s);
          paired.add(a); paired.add(b); used.add(a); used.add(b);
          out.byItem.set(a, s); out.byItem.set(b, s);
        }
      }
    }

    const leftover = pg.items.filter((i) => !used.has(i));
    if (leftover.length) {
      const groups = [];
      leftover.forEach((it) => {
        const g = groups.find((x) => x.type === it.type);
        if (g) g.n++; else groups.push({ type: it.type, n: 1 });
      });
      const alsoUsed = (type) => pg.items.some((i) => i.type === type && used.has(i));
      const words = groups.map((g) => g.n === 1
        ? (alsoUsed(g.type) ? `another ${BY_ID[g.type].name}` : withA(BY_ID[g.type]))
        : `${NUM[g.n] || g.n} more ${BY_ID[g.type].plural}`.replace(' more', alsoUsed(g.type) ? ' more' : ''));
      out.sentences.push(`There ${groups[0].n === 1 ? 'is' : 'are'} ${listJoin(words)}.`);
    }

    if (out.sentences.length) {
      const first = out.sentences[0];
      out.sentences[0] = `${SCENES[pg.scene].phrase}, ${lowerFirst(first)}`;
      out.byItem.forEach((v, k) => { if (v === first) out.byItem.set(k, first); });
    }
    return out;
  }

  const pageText = (pg) => describe(pg).sentences.join(' ');

  function renderText(highlightFrom = -1) {
    const txt = pageText(page());
    if (!txt) {
      textEl.classList.add('empty');
      textEl.textContent = 'Tap a sticker to start your story!';
      return;
    }
    textEl.classList.remove('empty');
    let idx = 0;
    textEl.innerHTML = txt.split(' ').map((w) => {
      const start = idx;
      idx += w.length + 1;
      return `<span class="w" data-start="${start}" data-end="${start + w.length}">${w}</span>`;
    }).join(' ');
  }

  function highlightAt(charIndex) {
    textEl.querySelectorAll('.w').forEach((s) => {
      s.classList.toggle('on', charIndex >= +s.dataset.start && charIndex < +s.dataset.end + 1);
    });
  }
  const clearHighlight = () => textEl.querySelectorAll('.w.on').forEach((s) => s.classList.remove('on'));

  // ================= RENDER =================
  function renderScene() {
    sceneEl.innerHTML = SCENES[page().scene].svg;
    [...bgsEl.children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === page().scene)));
  }

  function zFor(it, order) {
    const def = BY_ID[it.type];
    const base = def.kind === 'place' ? (def.front ? 25 : 5) : def.kind === 'char' ? 15 : 35;
    return base + order * 0.01;
  }

  function renderStickers() {
    stickersEl.innerHTML = '';
    page().items.forEach((it, i) => stickersEl.appendChild(makeStickerEl(it, i, false)));
  }

  function makeStickerEl(it, order, animate) {
    const def = BY_ID[it.type];
    const el = document.createElement('div');
    el.className = 'sticker';
    const size = sizeFor(def);
    el.style.width = el.style.height = size + 'px';
    el.style.left = it.x * 100 + '%';
    el.style.top = it.y * 100 + '%';
    el.style.zIndex = Math.round(zFor(it, order) * 100);
    el.setAttribute('aria-label', def.name);
    el.innerHTML = `<div class="art"${animate ? '' : ' style="animation:none"'}><svg viewBox="0 0 100 100" aria-hidden="true">${def.svg}</svg></div>`;
    it.el = el;
    attachDrag(it);
    return el;
  }

  function renderNav() {
    dotsEl.innerHTML = pages.map((_, i) => `<div class="dot${i === current ? ' on' : ''}"></div>`).join('');
    prevBtn.disabled = current === 0;
    const onLast = current === pages.length - 1;
    if (onLast) {
      nextIcon.setAttribute('d', 'M12 5 L12 19 M5 12 L19 12');
      nextBtn.setAttribute('aria-label', 'New page');
      nextBtn.disabled = !page().items.length || pages.length >= MAX_PAGES;
    } else {
      nextIcon.setAttribute('d', 'M9 5 L16 12 L9 19');
      nextBtn.setAttribute('aria-label', 'Next page');
      nextBtn.disabled = false;
    }
  }

  function renderAll(flip) {
    renderScene();
    renderStickers();
    renderText();
    renderNav();
    if (flip) {
      pageEl.classList.remove('flip');
      void pageEl.getBoundingClientRect();
      pageEl.classList.add('flip');
    }
  }

  // ================= ADDING STICKERS =================
  function clamp01(v, pad = 0.1) { return Math.max(pad, Math.min(1 - pad, v)); }

  function addSticker(def) {
    unlockAudio();
    stopReading();
    const pg = page();
    if (pg.items.length >= MAX_STICKERS) { tone(300, 0, 0.2, 0.3, 220); return; }
    const r = pageRect();
    const S = stickerSize();
    let x, y, target = null;

    if (def.kind !== 'char') {
      const before = describe(pg);
      const chars = pg.items.filter((i) => BY_ID[i.type].kind === 'char').reverse();
      target = chars.find((c) => {
        const s = before.byItem.get(c);
        if (!s) return true;
        if (def.kind === 'prop') return !pg.items.some((i) => BY_ID[i.type].kind === 'prop' && before.byItem.get(i) === s);
        return !pg.items.some((i) => BY_ID[i.type].kind === 'place' && before.byItem.get(i) === s);
      });
    }

    if (target) {
      x = clamp01(target.x + (def.attach[0] * S) / r.width, 0.06);
      y = clamp01(target.y + (def.attach[1] * S) / r.height, 0.08);
    } else {
      let bestScore = -1;
      for (let tries = 0; tries < 80; tries++) {
        const cx = 0.18 + Math.random() * 0.64;
        const cy = 0.25 + Math.random() * 0.55;
        const score = pg.items.length
          ? Math.min(...pg.items.map((i) => Math.hypot((i.x - cx) * r.width, (i.y - cy) * r.height)))
          : Infinity;
        if (score > bestScore) { bestScore = score; x = cx; y = cy; }
        if (score > S * 1.3) break;
      }
    }

    const it = { id: uid++, type: def.id, x, y };
    pg.items.push(it);
    stickersEl.appendChild(makeStickerEl(it, pg.items.length - 1, true));
    popSound();
    renderText();
    renderNav();

    const rect = it.el.getBoundingClientRect();
    sparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 5);

    const s = describe(pg).byItem.get(it);
    if (target && s) say(stripScene(s), { onlyText: true });
    else say(`${cap(withA(def))}!`);
  }

  const stripScene = (s) => {
    for (const sc of SCENES) if (s.startsWith(sc.phrase + ', ')) return cap(s.slice(sc.phrase.length + 2));
    return s;
  };

  // ================= DRAGGING =================
  function attachDrag(it) {
    const el = it.el;
    let st = null;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      unlockAudio();
      stopReading();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      const r = pageRect();
      st = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: it.x, oy: it.y, moved: 0, r, before: describe(page()).byItem.get(it) };
      el.classList.add('dragging');
      el.style.zIndex = 9999;
    });
    el.addEventListener('pointermove', (e) => {
      if (!st || e.pointerId !== st.id) return;
      const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
      st.moved = Math.max(st.moved, Math.hypot(dx, dy));
      it.x = st.ox + dx / st.r.width;
      it.y = st.oy + dy / st.r.height;
      el.style.left = it.x * 100 + '%';
      el.style.top = it.y * 100 + '%';
      if (st.moved > 12) trashEl.classList.add('show');
      trashEl.classList.toggle('hot', overTrash(e));
    });
    const end = (e) => {
      if (!st || e.pointerId !== st.id) return;
      const s0 = st;
      st = null;
      el.classList.remove('dragging');
      trashEl.classList.remove('show');
      const hot = overTrash(e);
      trashEl.classList.remove('hot');
      const pg = page();

      if (s0.moved < 10) {
        it.x = s0.ox; it.y = s0.oy;
        el.style.zIndex = Math.round(zFor(it, pg.items.indexOf(it)) * 100);
        el.classList.remove('wiggle');
        void el.getBoundingClientRect();
        el.classList.add('wiggle');
        tone(880, 0, 0.2, 0.3, 1200);
        say(cap(withA(BY_ID[it.type])) + '!');
        return;
      }

      const outside = it.x < -0.02 || it.x > 1.02 || it.y < -0.02 || it.y > 1.02;
      if (hot || outside) {
        pg.items.splice(pg.items.indexOf(it), 1);
        el.classList.add('poof');
        setTimeout(() => el.remove(), 300);
        tone(500, 0, 0.25, 0.3, 200);
        renderText();
        renderNav();
        return;
      }

      it.x = clamp01(it.x, 0.03);
      it.y = clamp01(it.y, 0.05);
      el.style.left = it.x * 100 + '%';
      el.style.top = it.y * 100 + '%';
      pg.items.splice(pg.items.indexOf(it), 1);
      pg.items.push(it);
      el.style.zIndex = Math.round(zFor(it, pg.items.length - 1) * 100);
      renderText();
      const after = describe(pg).byItem.get(it);
      if (after && after !== s0.before) {
        chime();
        say(stripScene(after));
        const rect = el.getBoundingClientRect();
        sparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 6);
      } else {
        tone(660, 0, 0.15, 0.2);
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  function overTrash(e) {
    const t = trashEl.getBoundingClientRect();
    return trashEl.classList.contains('show') &&
      e.clientX > t.left - 16 && e.clientX < t.right + 16 && e.clientY > t.top - 16 && e.clientY < t.bottom + 16;
  }

  // ================= PAGES =================
  function goTo(i, flip = true) {
    current = Math.max(0, Math.min(pages.length - 1, i));
    renderAll(flip);
    pageSound();
  }

  prevBtn.addEventListener('click', () => { unlockAudio(); stopReading(); if (current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', () => {
    unlockAudio();
    stopReading();
    if (current < pages.length - 1) { goTo(current + 1); return; }
    if (!page().items.length || pages.length >= MAX_PAGES) return;
    pages.push({ scene: page().scene, items: [] });
    goTo(pages.length - 1);
    say('New page!');
  });

  // ================= READING =================
  let readToken = 0;
  function stopReading() {
    readToken++;
    clearHighlight();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  function say(text, opts = {}) {
    if (!soundOn || !text || !('speechSynthesis' in window)) { opts.onend && setTimeout(opts.onend, 1200); return; }
    try {
      if (!opts.queue) window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = opts.rate || 0.88;
      u.pitch = 1.2;
      if (opts.highlight) {
        u.onboundary = (ev) => { if (ev.name === 'word' || ev.charIndex != null) highlightAt(ev.charIndex); };
      }
      u.onend = () => { if (opts.highlight) clearHighlight(); opts.onend && opts.onend(); };
      u.onerror = () => { opts.onend && opts.onend(); };
      window.speechSynthesis.speak(u);
    } catch (_) { opts.onend && opts.onend(); }
  }

  document.getElementById('readBtn').addEventListener('click', () => {
    unlockAudio();
    stopReading();
    const txt = pageText(page());
    chime();
    if (!txt) { say('Tap a sticker to start your story!'); return; }
    renderText();
    setTimeout(() => say(txt, { highlight: true }), 150);
  });

  document.getElementById('bookBtn').addEventListener('click', () => {
    unlockAudio();
    stopReading();
    const token = readToken;
    const order = pages.map((p, i) => i).filter((i) => pages[i].items.length);
    if (!order.length) { say('Tap a sticker to start your story!'); return; }
    chime();
    goTo(order[0]);
    let k = 0;
    const next = () => {
      if (token !== readToken) return;
      if (k >= order.length) {
        say('The end!', { onend: () => {} });
        const r = pageRect();
        for (let i = 0; i < 4; i++) setTimeout(() => sparkles(r.left + r.width * (0.2 + Math.random() * 0.6), r.top + r.height * (0.2 + Math.random() * 0.6), 8), i * 150);
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.1, 0.6, 0.3));
        return;
      }
      if (current !== order[k]) goTo(order[k]);
      const txt = pageText(pages[order[k]]);
      k++;
      setTimeout(() => {
        if (token !== readToken) return;
        say(txt, { highlight: true, onend: () => setTimeout(next, 700) });
      }, 450);
    };
    say('Once upon a time.', { onend: () => setTimeout(next, 300) });
  });

  // ================= SCENES + TRAY =================
  SCENES.forEach((sc, i) => {
    const b = document.createElement('button');
    b.className = 'bg-btn';
    b.style.setProperty('--c', sc.swatch);
    b.setAttribute('aria-label', sc.phrase);
    b.addEventListener('click', () => {
      unlockAudio();
      stopReading();
      page().scene = i;
      renderScene();
      renderText();
      tone(988, 0, 0.25, 0.3);
      say(sc.phrase + '!');
    });
    bgsEl.appendChild(b);
  });

  STICKERS.forEach((def) => {
    const b = document.createElement('button');
    b.className = 'tile';
    b.setAttribute('aria-label', 'Add ' + withA(def));
    b.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${def.svg}</svg>`;
    b.addEventListener('click', () => addSticker(def));
    trayEl.appendChild(b);
  });

  // ================= EFFECTS + SOUND =================
  function sparkles(x, y, n) {
    const colors = ['#FFD23F', '#FF8FC2', '#8FD6F2', '#C7B3FF'];
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px');
      el.style.setProperty('--dy', (Math.random() * -70 - 10) + 'px');
      el.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="${starPts(12, 12, 11, 4)}" fill="${colors[i % colors.length]}"/></svg>`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  let ac = null, master = null, noiseBuf = null;
  function unlockAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.16;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.6, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function tone(freq, when = 0, len = 0.4, vol = 0.3, glideTo) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + len);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + len + 0.05);
  }
  const popSound = () => tone(520, 0, 0.18, 0.4, 1040);
  const chime = () => [1046.5, 1318.51, 1567.98].forEach((f, i) => tone(f, i * 0.07, 0.45, 0.28));
  function pageSound() {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(1800, t);
    f.frequency.exponentialRampToValueAtTime(3500, t + 0.25);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.3);
  }

  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    unlockAudio();
    soundOn = !soundOn;
    if (!soundOn) stopReading();
    document.getElementById('waves').style.display = soundOn ? '' : 'none';
    document.getElementById('mute').style.display = soundOn ? 'none' : '';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
    if (soundOn) tone(880, 0, 0.25, 0.3);
  });

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  pageEl.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  let lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', () => {
    if (Math.abs(window.innerWidth - lastW) > 20 || Math.abs(window.innerHeight - lastH) > 60) {
      lastW = window.innerWidth; lastH = window.innerHeight;
      renderStickers();
      renderText();
    }
  });

  renderAll(false);
})();
</script>
</body>
</html>
