<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef6fb">
<title>Bath Time Boats</title>
<!--
  BATH TIME BOATS — splashy water toy for a 3-year-old (phone, touch-first)

  How it plays:
  - Touch or swirl the water to make ripples. The waves push the floating toys around.
  - Five bath toys float in the tub: big duck, baby duck, sailboat, tugboat, and a little whale.
  - Drag a toy to steer it, or flick it to send it sailing. Tap a toy and it does its thing:
    ducks squeak and hop, the tugboat toots, the sailboat spins, the whale sprays water.
  - Soap bubbles float around; tap to pop them. The bubble button (top-right) adds a bunch more.
  - The faucet drips now and then so the water is never completely still.
  - Top-left: sound on/off. No voice in this one, just sound effects.

  INTEGRATION NOTES (for Claude Code):
  - This is a TOY. Parent page is /toys.html. Add a card for it there, and place the file
    wherever the other toys linked from /toys.html already live.
  - Fully self-contained: no external fonts, images, audio, scripts, or storage.
  - No in-page back link on purpose (toddler taps). If the other toys link back to /toys.html,
    keep it small and away from the two top corner buttons.
  - Water is a small ripple simulation drawn to a low-res canvas and stretched, so it runs smoothly on phones.
  - Audio unlocks on first touch (iOS requirement). Respects prefers-reduced-motion.
  - Bright bathroom palette on purpose instead of the site's OLED/green theme — it's kid-facing.
-->
<style>
  :root{
    --tile:#eef6fb;
    --grout:#d9e8f2;
    --rim:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background-color:var(--tile);
    background-image:
      linear-gradient(var(--grout) 2px,transparent 2px),
      linear-gradient(90deg,var(--grout) 2px,transparent 2px);
    background-size:44px 44px;
    touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  }
  button{border:0;background:none;cursor:pointer}
  button:focus-visible{outline:3px solid #2f7fb0;outline-offset:3px}

  .tub{
    position:fixed;
    left:10px;right:10px;
    top:calc(70px + env(safe-area-inset-top));
    bottom:calc(14px + env(safe-area-inset-bottom));
    border-radius:52px;
    background:var(--rim);
    box-shadow:0 10px 24px rgba(60,110,150,.22), inset 0 -6px 0 #e3eef5;
    padding:14px;
  }
  .water{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#6ec6f0;box-shadow:inset 0 6px 14px rgba(20,80,120,.25)}
  #water{position:absolute;inset:0;width:100%;height:100%;display:block}
  #toys{position:absolute;inset:0;pointer-events:none}

  .toy,.bubble,.drop{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
  .toy svg{width:100%;height:100%;display:block;overflow:visible}
  .toy .shadow{position:absolute;left:12%;right:12%;bottom:-2%;height:18%;border-radius:50%;background:rgba(20,70,110,.22);filter:blur(2px)}
  .toy .art{position:absolute;inset:0;transition:transform .12s}

  .bubble{
    border-radius:50%;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.25) 13% 55%,rgba(200,170,255,.35) 75%,rgba(255,255,255,.7) 100%);
    box-shadow:inset 0 0 6px rgba(255,255,255,.8);
  }
  .bubble.popping{animation:pop .22s ease-out forwards}
  @keyframes pop{to{transform:var(--t) scale(1.6);opacity:0}}

  .drop{width:10px;height:14px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:#bfe9ff}

  .faucet{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);width:96px;height:66px;z-index:3;pointer-events:none}

  .corner{
    position:fixed;top:calc(12px + env(safe-area-inset-top));
    width:52px;height:52px;border-radius:50%;
    background:#fff;box-shadow:0 3px 10px rgba(60,110,150,.22);
    display:grid;place-items:center;z-index:4
  }
  .corner svg{width:28px;height:28px}
  #soundBtn{left:12px}
  #bubbleBtn{right:12px}
</style>
</head>
<body>
  <svg class="faucet" viewBox="0 0 96 66" aria-hidden="true">
    <rect x="6" y="6" width="84" height="16" rx="8" fill="#c9d6df"/>
    <rect x="36" y="0" width="24" height="12" rx="5" fill="#b3c3ce"/>
    <path d="M58,22 L58,40 Q58,56 44,56 L40,56 L40,46 L44,46 Q48,46 48,40 L48,22 Z" fill="#c9d6df"/>
    <rect x="37" y="52" width="10" height="10" rx="3" fill="#b3c3ce"/>
    <circle cx="16" cy="14" r="5" fill="#ff8a8a"/><circle cx="80" cy="14" r="5" fill="#8fd6f2"/>
  </svg>

  <button class="corner" id="soundBtn" aria-label="Sound on" aria-pressed="true">
    <svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="#2f7fb0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10h4l5-4v14l-5-4H4z" fill="#2f7fb0"/>
      <path id="waves" d="M17 9.5a5 5 0 0 1 0 7M20 7a8.5 8.5 0 0 1 0 12"/>
      <path id="mute" d="M17 10l6 6M23 10l-6 6" style="display:none"/>
    </svg>
  </button>
  <button class="corner" id="bubbleBtn" aria-label="More bubbles">
    <svg viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="11" cy="15" r="8" fill="#d6f0ff" stroke="#8fd6f2" stroke-width="2"/>
      <circle cx="20" cy="8" r="5" fill="#eadfff" stroke="#c7b3ff" stroke-width="2"/>
      <circle cx="21" cy="20" r="3.5" fill="#d6f0ff" stroke="#8fd6f2" stroke-width="1.6"/>
      <circle cx="8" cy="12" r="2" fill="#fff"/>
    </svg>
  </button>

  <div class="tub">
    <div class="water" id="waterWrap">
      <canvas id="water" aria-label="Bath water. Touch to make waves."></canvas>
      <div id="toys"></div>
    </div>
  </div>

<script>
(() => {
  const wrap = document.getElementById('waterWrap');
  const canvas = document.getElementById('water');
  const ctx = canvas.getContext('2d');
  const toysEl = document.getElementById('toys');
  const faucet = document.querySelector('.faucet');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ================= TOY ART (viewBox 0 0 120 100) =================
  const duckSvg = (body = '#FFD23F', wing = '#F2B705') =>
    `<path d="M16,62 C14,44 32,38 52,44 C56,30 66,16 84,18 C100,20 106,36 98,46 C94,52 88,54 84,56 C100,58 108,68 102,78 C94,92 30,94 18,78 Z" fill="${body}"/>` +
    `<path d="M40,62 C50,52 70,54 76,64 C68,74 48,76 40,62 Z" fill="${wing}"/>` +
    `<path d="M98,32 C112,31 118,38 106,43 C101,45 96,41 98,32 Z" fill="#FF8A3D"/>` +
    `<circle cx="86" cy="30" r="4.5" fill="#2e2a33"/><circle cx="87.5" cy="28.5" r="1.5" fill="#fff"/>` +
    `<ellipse cx="80" cy="40" rx="5" ry="3" fill="#FF9FB3" opacity=".5"/>`;

  const TOYS = [
    { id: 'duck', size: 1.0, action: 'squeak', svg: duckSvg() },
    { id: 'babyduck', size: 0.68, action: 'squeakHigh', svg: duckSvg('#FFE27A', '#FFD23F') },
    { id: 'sailboat', size: 1.0, action: 'spin', svg:
      `<rect x="60" y="10" width="4" height="56" rx="2" fill="#8b6a4e"/>` +
      `<path d="M66,14 L66,58 L100,58 Z" fill="#ffffff"/>` +
      `<path d="M58,24 L58,58 L30,58 Z" fill="#8FD6F2"/>` +
      `<path d="M64,10 L80,14 L64,18 Z" fill="#FFD23F"/>` +
      `<path d="M12,64 L108,64 L94,88 L26,88 Z" fill="#FF6B6B"/>` +
      `<path d="M18,72 L102,72" stroke="#fff" stroke-width="4"/>` },
    { id: 'tugboat', size: 1.0, action: 'toot', svg:
      `<rect x="34" y="18" width="12" height="26" rx="3" fill="#FF6B6B"/><rect x="34" y="24" width="12" height="5" fill="#fff"/>` +
      `<rect x="48" y="30" width="42" height="30" rx="6" fill="#ffffff"/>` +
      `<rect x="56" y="36" width="12" height="12" rx="3" fill="#8FD6F2"/><rect x="72" y="36" width="12" height="12" rx="3" fill="#8FD6F2"/>` +
      `<path d="M8,58 L112,58 L100,88 L22,88 Q12,78 8,58 Z" fill="#4F8FE8"/>` +
      `<circle cx="36" cy="72" r="6" fill="#FFD23F" stroke="#fff" stroke-width="3"/>` +
      `<path d="M8,58 L112,58" stroke="#FFD23F" stroke-width="5" stroke-linecap="round"/>` },
    { id: 'whale', size: 1.05, action: 'spray', svg:
      `<path d="M98,58 C106,44 118,38 118,48 C118,54 112,58 106,60 C112,62 118,66 116,74 C112,80 102,72 98,64 Z" fill="#5AA9E6"/>` +
      `<path d="M8,60 C8,34 36,24 62,28 C88,32 104,48 102,64 C100,82 78,88 54,88 C28,88 8,78 8,60 Z" fill="#5AA9E6"/>` +
      `<path d="M14,68 C30,82 70,86 96,70 C90,84 70,88 54,88 C32,88 18,80 14,68 Z" fill="#D6F0FF"/>` +
      `<circle cx="30" cy="54" r="4.5" fill="#2e2a33"/><circle cx="31.5" cy="52.5" r="1.5" fill="#fff"/>` +
      `<path d="M18,66 Q26,72 36,68" stroke="#2e5d85" stroke-width="2.5" fill="none" stroke-linecap="round"/>` +
      `<ellipse cx="40" cy="62" rx="5" ry="3" fill="#FF9FB3" opacity=".55"/>` }
  ];

  // ================= STATE =================
  let W = 0, H = 0, GW = 90, GH = 0, cell = 1;
  let cur, prev, img, small, sctx;
  let toys = [], bubbles = [];
  let baseSize = 90;

  function setup() {
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    GW = 90;
    GH = Math.max(20, Math.round(GW * (H / W)));
    cell = W / GW;
    cur = new Float32Array(GW * GH);
    prev = new Float32Array(GW * GH);
    canvas.width = GW;
    canvas.height = GH;
    img = ctx.createImageData(GW, GH);
    baseSize = Math.max(70, Math.min(120, Math.min(W, H) * 0.24));
    toys.forEach((t) => {
      t.x = Math.min(Math.max(t.x, t.r), W - t.r);
      t.y = Math.min(Math.max(t.y, t.r), H - t.r);
    });
  }

  function makeToys() {
    toysEl.innerHTML = '';
    toys = TOYS.map((def, i) => {
      const size = baseSize * def.size;
      const el = document.createElement('div');
      el.className = 'toy';
      el.style.width = size + 'px';
      el.style.height = size * (100 / 120) + 'px';
      el.innerHTML = `<div class="shadow"></div><div class="art"><svg viewBox="0 0 120 100" aria-hidden="true">${def.svg}</svg></div>`;
      toysEl.appendChild(el);
      const cols = 2;
      const x = W * (0.3 + (i % cols) * 0.4) + (Math.random() * 20 - 10);
      const y = H * (0.18 + Math.floor(i / cols) * 0.3) + (Math.random() * 20 - 10);
      return {
        def, el, art: el.querySelector('.art'),
        x, y, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
        w: size, h: size * (100 / 120), r: size * 0.42,
        angle: 0, spin: 0, hop: 0, flip: 1, drag: null
      };
    });
  }

  // ================= WATER =================
  function disturb(x, y, amount, radius = 3) {
    const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const px = gx + dx, py = gy + dy;
        if (px < 1 || py < 1 || px >= GW - 1 || py >= GH - 1) continue;
        const d = Math.hypot(dx, dy);
        if (d > radius) continue;
        cur[py * GW + px] += amount * (1 - d / (radius + 1));
      }
    }
  }

  function stepWater() {
    const damp = 0.975;
    for (let y = 1; y < GH - 1; y++) {
      for (let x = 1; x < GW - 1; x++) {
        const i = y * GW + x;
        prev[i] = ((cur[i - 1] + cur[i + 1] + cur[i - GW] + cur[i + GW]) * 0.5 - prev[i]) * damp;
      }
    }
    const t = prev; prev = cur; cur = t;
  }

  function drawWater() {
    const d = img.data;
    for (let y = 0; y < GH; y++) {
      const depth = y / GH;
      const br = 118 - depth * 24, bg = 204 - depth * 22, bb = 242 - depth * 8;
      for (let x = 0; x < GW; x++) {
        const i = y * GW + x;
        const a = (x > 0 && y > 0) ? cur[i - 1 - GW] : 0;
        const b = (x < GW - 1 && y < GH - 1) ? cur[i + 1 + GW] : 0;
        let light = Math.max(-70, Math.min(70, (a - b) * 1.1));
        const glint = light > 22 ? (light - 22) * 1.5 : 0;
        const o = i * 4;
        d[o] = Math.max(0, Math.min(255, br + light + glint));
        d[o + 1] = Math.max(0, Math.min(255, bg + light + glint));
        d[o + 2] = Math.max(0, Math.min(255, bb + light * 0.6 + glint));
        d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  const heightAt = (x, y) => {
    const gx = Math.min(GW - 2, Math.max(1, Math.floor(x / cell)));
    const gy = Math.min(GH - 2, Math.max(1, Math.floor(y / cell)));
    return { gx, gy, i: gy * GW + gx };
  };

  // ================= TOYS PHYSICS =================
  function updateToys(dt) {
    const f = dt * 60;
    for (const t of toys) {
      if (!t.drag) {
        const { i } = heightAt(t.x, t.y);
        const fx = cur[i - 2] - cur[i + 2];
        const fy = cur[i - 2 * GW] - cur[i + 2 * GW];
        t.vx += fx * 0.035 * f + (W / 2 - t.x) * 0.00003 * f;
        t.vy += fy * 0.035 * f + (H / 2 - t.y) * 0.00003 * f;
        t.vx *= Math.pow(0.97, f);
        t.vy *= Math.pow(0.97, f);
        const sp = Math.hypot(t.vx, t.vy);
        if (sp > 14) { t.vx *= 14 / sp; t.vy *= 14 / sp; }
        t.x += t.vx * f;
        t.y += t.vy * f;
        if (sp > 1.5) disturb(t.x - t.vx * 3, t.y - t.vy * 3, -sp * 1.2, 2);
      }
      // walls
      if (t.x < t.r) { t.x = t.r; t.vx = Math.abs(t.vx) * 0.6; }
      if (t.x > W - t.r) { t.x = W - t.r; t.vx = -Math.abs(t.vx) * 0.6; }
      if (t.y < t.r * 0.8) { t.y = t.r * 0.8; t.vy = Math.abs(t.vy) * 0.6; }
      if (t.y > H - t.r * 0.8) { t.y = H - t.r * 0.8; t.vy = -Math.abs(t.vy) * 0.6; }
    }
    // keep toys from overlapping
    for (let a = 0; a < toys.length; a++) {
      for (let b = a + 1; b < toys.length; b++) {
        const A = toys[a], B = toys[b];
        const dx = B.x - A.x, dy = B.y - A.y;
        const dist = Math.hypot(dx, dy) || 0.01;
        const min = (A.r + B.r) * 0.85;
        if (dist < min) {
          const push = (min - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          if (!A.drag) { A.x -= nx * push; A.y -= ny * push; A.vx -= nx * 0.4; A.vy -= ny * 0.4; }
          if (!B.drag) { B.x += nx * push; B.y += ny * push; B.vx += nx * 0.4; B.vy += ny * 0.4; }
        }
      }
    }
    // draw
    for (const t of toys) {
      const { i } = heightAt(t.x, t.y);
      const h = Math.max(-40, Math.min(40, cur[i]));
      if (Math.abs(t.vx) > 0.3) t.flip = t.vx < 0 ? -1 : 1;
      const targetAngle = Math.max(-18, Math.min(18, t.vx * 3 + h * 0.2));
      t.angle += (targetAngle - t.angle) * 0.1 * f;
      if (t.spin > 0) t.spin = Math.max(0, t.spin - 12 * f);
      if (t.hop > 0) t.hop = Math.max(0, t.hop - 0.05 * f);
      const hopY = Math.sin(t.hop * Math.PI) * -t.h * 0.35;
      const scale = 1 + h * 0.002 + (t.drag ? 0.08 : 0);
      t.el.style.transform = `translate(${t.x - t.w / 2}px, ${t.y - t.h / 2}px)`;
      t.art.style.transform = `translateY(${hopY}px) rotate(${t.angle + t.spin}deg) scale(${scale * t.flip}, ${scale})`;
    }
  }

  // ================= BUBBLES =================
  function addBubble(x, y) {
    if (bubbles.length >= 16) return;
    const size = 18 + Math.random() * 28;
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = el.style.height = size + 'px';
    toysEl.appendChild(el);
    bubbles.push({
      el, size,
      x: x ?? size + Math.random() * (W - size * 2),
      y: y ?? size + Math.random() * (H - size * 2),
      vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
      wob: Math.random() * 6
    });
  }

  function updateBubbles(dt) {
    const f = dt * 60;
    for (const b of bubbles) {
      const { i } = heightAt(b.x, b.y);
      b.vx += (cur[i - 1] - cur[i + 1]) * 0.05 * f + (Math.random() - 0.5) * 0.03;
      b.vy += (cur[i - GW] - cur[i + GW]) * 0.05 * f + (Math.random() - 0.5) * 0.03;
      b.vx *= 0.96; b.vy *= 0.96;
      b.x += b.vx * f; b.y += b.vy * f;
      b.wob += dt * 2;
      const r = b.size / 2;
      if (b.x < r) { b.x = r; b.vx *= -1; }
      if (b.x > W - r) { b.x = W - r; b.vx *= -1; }
      if (b.y < r) { b.y = r; b.vy *= -1; }
      if (b.y > H - r) { b.y = H - r; b.vy *= -1; }
      const t = `translate(${b.x - r}px, ${b.y - r}px)`;
      b.el.style.setProperty('--t', t);
      b.el.style.transform = `${t} scale(${1 + Math.sin(b.wob) * 0.04})`;
    }
  }

  function popBubble(b) {
    bubbles.splice(bubbles.indexOf(b), 1);
    b.el.classList.add('popping');
    b.el.addEventListener('animationend', () => b.el.remove());
    disturb(b.x, b.y, 30, 2);
    popSound();
  }

  // ================= ACTIONS =================
  function toyAction(t) {
    switch (t.def.action) {
      case 'squeak': t.hop = 1; squeak(1); disturb(t.x, t.y + t.h * 0.3, 60, 3); break;
      case 'squeakHigh': t.hop = 1; squeak(1.5); disturb(t.x, t.y + t.h * 0.3, 40, 2); break;
      case 'spin': t.spin = 360; bell(); disturb(t.x, t.y, 40, 4); break;
      case 'toot': t.hop = 0.6; toot(); puffs(t); break;
      case 'spray': spray(t); break;
    }
  }

  function puffs(t) {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const d = document.createElement('div');
        d.className = 'drop';
        d.style.background = '#ffffff';
        d.style.width = d.style.height = '16px';
        d.style.borderRadius = '50%';
        d.style.opacity = '.9';
        toysEl.appendChild(d);
        const sx = t.x + (t.flip > 0 ? -0.2 : 0.2) * t.w, sy = t.y - t.h * 0.35;
        d.animate([
          { transform: `translate(${sx}px, ${sy}px) scale(.6)`, opacity: .9 },
          { transform: `translate(${sx + (Math.random() * 20 - 10)}px, ${sy - 60}px) scale(1.6)`, opacity: 0 }
        ], { duration: 900, easing: 'ease-out' }).onfinish = () => d.remove();
      }, i * 150);
    }
  }

  function spray(t) {
    t.hop = 0.5;
    splashSound(0.6);
    const sx = t.x + (t.flip > 0 ? -0.15 : 0.15) * t.w, sy = t.y - t.h * 0.3;
    const n = reduceMotion ? 5 : 12;
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'drop';
      toysEl.appendChild(d);
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
      const dist = 50 + Math.random() * 60;
      const ex = sx + Math.cos(ang) * dist, ey = sy + Math.sin(ang) * dist;
      const landX = ex + Math.cos(ang) * 30, landY = sy + 30 + Math.random() * 40;
      d.animate([
        { transform: `translate(${sx}px, ${sy}px)`, opacity: 1 },
        { transform: `translate(${ex}px, ${ey}px)`, opacity: 1, offset: 0.45 },
        { transform: `translate(${landX}px, ${landY}px)`, opacity: 0.2 }
      ], { duration: 900, easing: 'ease-out' }).onfinish = () => {
        d.remove();
        disturb(landX, landY, 35, 2);
      };
    }
  }

  // ================= INPUT =================
  const pointers = new Map();
  const local = (e) => {
    const r = wrap.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  wrap.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    unlockAudio();
    try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
    const { x, y } = local(e);

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot(b.x - x, b.y - y) < b.size / 2 + 10) {
        popBubble(b);
        pointers.set(e.pointerId, { x, y, toy: null, lastSound: performance.now() });
        return;
      }
    }

    let hit = null, best = Infinity;
    for (const t of toys) {
      if (t.drag) continue;
      const d = Math.hypot(t.x - x, t.y - y);
      if (d < t.r * 1.05 && d < best) { hit = t; best = d; }
    }
    if (hit) {
      hit.drag = { id: e.pointerId, ox: hit.x - x, oy: hit.y - y, t0: performance.now(), moved: 0, lx: x, ly: y, vx: 0, vy: 0 };
      hit.vx = hit.vy = 0;
      pointers.set(e.pointerId, { x, y, toy: hit, lastSound: 0 });
    } else {
      disturb(x, y, 140, 4);
      splashSound(1);
      pointers.set(e.pointerId, { x, y, toy: null, lastSound: performance.now() });
    }
  });

  wrap.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const { x, y } = local(e);
    if (p.toy) {
      const t = p.toy, d = t.drag;
      d.moved += Math.hypot(x - d.lx, y - d.ly);
      d.vx = d.vx * 0.5 + (x - d.lx) * 0.5;
      d.vy = d.vy * 0.5 + (y - d.ly) * 0.5;
      d.lx = x; d.ly = y;
      t.x = x + d.ox; t.y = y + d.oy;
      if (Math.abs(d.vx) > 0.5) t.flip = d.vx < 0 ? -1 : 1;
      disturb(t.x, t.y + t.h * 0.3, Math.min(40, Math.hypot(d.vx, d.vy) * 6), 2);
    } else {
      const steps = Math.max(1, Math.ceil(Math.hypot(x - p.x, y - p.y) / (cell * 2)));
      for (let s = 1; s <= steps; s++) {
        disturb(p.x + ((x - p.x) * s) / steps, p.y + ((y - p.y) * s) / steps, 22, 3);
      }
      const now = performance.now();
      if (now - p.lastSound > 160 && Math.hypot(x - p.x, y - p.y) > 4) {
        swish();
        p.lastSound = now;
      }
    }
    p.x = x; p.y = y;
  });

  const endPointer = (e) => {
    const p = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    if (!p || !p.toy) return;
    const t = p.toy, d = t.drag;
    t.drag = null;
    if (d.moved < 12 && performance.now() - d.t0 < 450) {
      toyAction(t);
    } else {
      t.vx = Math.max(-14, Math.min(14, d.vx * 0.8));
      t.vy = Math.max(-14, Math.min(14, d.vy * 0.8));
      disturb(t.x, t.y, 60, 3);
    }
  };
  wrap.addEventListener('pointerup', endPointer);
  wrap.addEventListener('pointercancel', endPointer);

  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  document.getElementById('bubbleBtn').addEventListener('click', () => {
    unlockAudio();
    for (let i = 0; i < 8; i++) setTimeout(() => { addBubble(); bubbleBlip(i); }, i * 90);
  });

  // ================= FAUCET DRIP =================
  function drip() {
    const fr = faucet.getBoundingClientRect();
    const wr = wrap.getBoundingClientRect();
    const sx = fr.left + fr.width * 0.44 - wr.left;
    const targetY = 30 + Math.random() * 20;
    const d = document.createElement('div');
    d.className = 'drop';
    toysEl.appendChild(d);
    const startY = fr.bottom - wr.top;
    d.animate([
      { transform: `translate(${sx - 5}px, ${startY}px) scale(.6)` },
      { transform: `translate(${sx - 5}px, ${targetY}px) scale(1)` }
    ], { duration: 450, easing: 'ease-in' }).onfinish = () => {
      d.remove();
      disturb(sx, targetY, 90, 3);
      tone(1400 + Math.random() * 300, 0, 0.18, 0.18, 700);
    };
  }

  // ================= SOUND =================
  let ac = null, master = null, noiseBuf = null, soundOn = true;
  function unlockAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.2;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function tone(freq, when = 0, len = 0.4, vol = 0.3, glideTo, type = 'sine') {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + len);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + len + 0.05);
  }
  function noise(len, freq, q, vol, type = 'bandpass', sweepTo) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + len);
    f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + len + 0.05);
  }
  const splashSound = (k) => { noise(0.35 * k + 0.1, 900, 0.7, 0.7 * k, 'lowpass', 300); tone(420, 0, 0.15, 0.15 * k, 900); };
  const swish = () => noise(0.25, 700, 1.2, 0.25, 'bandpass', 1300);
  const popSound = () => { tone(900, 0, 0.08, 0.35, 1800); noise(0.05, 3000, 1, 0.2); };
  const bubbleBlip = (i) => tone(600 + i * 90, 0, 0.12, 0.15, 1200);
  function squeak(k) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'sawtooth';
    f.type = 'bandpass'; f.frequency.value = 1400 * k; f.Q.value = 3;
    o.frequency.setValueAtTime(700 * k, t);
    o.frequency.exponentialRampToValueAtTime(1300 * k, t + 0.08);
    o.frequency.exponentialRampToValueAtTime(800 * k, t + 0.22);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.3);
  }
  function toot() {
    [0, 0.32].forEach((w) => {
      tone(196, w, 0.26, 0.28, null, 'square');
      tone(247, w, 0.26, 0.18, null, 'square');
    });
  }
  const bell = () => [1318.5, 1760, 2093].forEach((f, i) => tone(f, i * 0.09, 0.6, 0.22));

  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    unlockAudio();
    soundOn = !soundOn;
    document.getElementById('waves').style.display = soundOn ? '' : 'none';
    document.getElementById('mute').style.display = soundOn ? 'none' : '';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
    if (soundOn) tone(880, 0, 0.2, 0.25);
  });

  // ================= LOOP =================
  let last = performance.now(), nextDrip = last + 2500, nextBubble = last + 3000;
  function frame(ts) {
    const dt = Math.min(50, ts - last) / 1000;
    last = ts;
    stepWater();
    updateToys(dt);
    updateBubbles(dt);
    drawWater();
    if (ts > nextDrip) { drip(); nextDrip = ts + (reduceMotion ? 7000 : 3200 + Math.random() * 2500); }
    if (ts > nextBubble) { if (bubbles.length < 5) addBubble(); nextBubble = ts + 4000; }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', setup);
  setup();
  makeToys();
  for (let i = 0; i < 4; i++) addBubble();
  requestAnimationFrame(frame);
})();
</script>
</body>
