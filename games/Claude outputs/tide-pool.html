<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tide Pool</title>
<meta name="description" content="Tap the water and Alaska sea animals swim in. Touch one and it says hello.">
<meta name="theme-color" content="#052e3d">
<style>
  html{color-scheme:dark;height:100%}
  body{
    margin:0;height:100%;background:#052e3d;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}
  .home{
    position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:3;
    width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.32);
    color:rgba(255,255,255,.55);text-decoration:none;font-size:19px;line-height:34px;text-align:center;
  }
  .gate{
    position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 42%, #0a5c72 0%, #052e3d 72%);
    color:#fff;cursor:pointer;
  }
  .gate.gone{display:none}
  .gate h1{font-size:clamp(32px,10vw,56px);margin:0;font-weight:800;letter-spacing:-.02em}
  .gate p{margin:0;color:#9fd8e8;font-size:17px}
  .gate svg{width:min(50vw,210px);height:auto}
</style>
</head>

/* ---------------- audio ---------------- */
let AC = null, bus = null, voice = null;
function boot(){
  if(AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  bus = AC.createGain(); bus.gain.value = 0.55; bus.connect(AC.destination);
  voice = document.createElement("audio");
  voice.setAttribute("playsinline", "");
  voice.autoplay = false;
  voice.preload = "auto";
  voice.src = "data:audio/mpeg;base64," + SND;
  voice.load();
}
let vTimer = null;
function say(name){
  if(!voice || !VOX[name]) return;
  const seg = VOX[name];
  const go = () => {
    try{
      voice.pause();
      voice.currentTime = seg[0];
      const p = voice.play();
      if(p && p.catch) p.catch(() => {});
    }catch(e){ return; }
    clearTimeout(vTimer);
    vTimer = setTimeout(() => { try{ voice.pause(); }catch(e){} }, seg[1] * 1000 + 80);
  };
  if(voice.readyState >= 1) go();
  else voice.addEventListener("loadedmetadata", go, { once: true });
}
function noiseBuf(dur){
  const len = Math.floor(AC.sampleRate * dur);
  const b = AC.createBuffer(1, len, AC.sampleRate);
  const d = b.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(); s.buffer = b; return s;
}
function splash(){
  if(!AC) return;
  const t = AC.currentTime, s = noiseBuf(0.35);
  const f = AC.createBiquadFilter(); f.type = "bandpass";
  f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.3); f.Q.value = 0.8;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t);
}
function bloop(up){
  if(!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(up ? 320 : 700, t);
  o.frequency.exponentialRampToValueAtTime(up ? 900 : 240, t + 0.18);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.25);
}

/* ---------------- canvas ---------------- */
const cv = document.getElementById("cv"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
const rnd = (a, b) => a + Math.random() * (b - a);
function sandY(){ return H * 0.86; }
function surfaceY(){ return H * 0.14; }

/* ---------------- creatures ---------------- */
/* zone: "top" floats at the surface, "mid" swims, "floor" walks the sand */
const KINDS = [
  { id: "sea-otter",   zone: "top",   r: 46, col: "#8a6a4f" },
  { id: "puffin",      zone: "top",   r: 34, col: "#20242b" },
  { id: "harbor-seal", zone: "mid",   r: 44, col: "#9aa7b3" },
  { id: "octopus",     zone: "mid",   r: 42, col: "#b4629b" },
  { id: "jellyfish",   zone: "mid",   r: 34, col: "#e8b7ff" },
  { id: "sea-lion",    zone: "mid",   r: 52, col: "#a8794f" },
  { id: "sea-star",    zone: "floor", r: 32, col: "#f07a3c" },
  { id: "crab",        zone: "floor", r: 30, col: "#e2503c" }
];
let critters = [], bubbles = [], inks = [], rings = [];

function spawn(kind, x, y){
  const k = kind || KINDS[(Math.random() * KINDS.length) | 0];
  const fromLeft = Math.random() < 0.5;
  let yy;
  if(k.zone === "top") yy = surfaceY() + rnd(6, 34);
  else if(k.zone === "floor") yy = sandY() - rnd(2, 16);
  else yy = rnd(surfaceY() + 70, sandY() - 50);
  critters.push({
    k: k, x: x != null ? x : (fromLeft ? -60 : W + 60), y: y != null ? y : yy,
    tx: rnd(W * 0.15, W * 0.85), ty: yy,
    dir: fromLeft ? 1 : -1, sp: rnd(0.25, 0.7), t0: rnd(0, 10),
    react: 0, spin: 0, seed: rnd(0, 100)
  });
  if(critters.length > 9) critters.shift();
}

function drawSeaOtter(c, t){
  const s = c.k.r, roll = c.spin;
  g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1); g.rotate(roll);
  g.fillStyle = "#7a5c44";
  g.beginPath(); g.ellipse(0, 0, s * 0.95, s * 0.52, 0, 0, 7); g.fill();
  g.fillStyle = "#c4a07c";
  g.beginPath(); g.ellipse(0, s * 0.1, s * 0.66, s * 0.34, 0, 0, 7); g.fill();
  /* paws on the belly */
  g.fillStyle = "#7a5c44";
  g.beginPath(); g.arc(-s * 0.12, -s * 0.04, s * 0.14, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.12, -s * 0.04, s * 0.14, 0, 7); g.fill();
  /* tail */
  g.strokeStyle = "#7a5c44"; g.lineWidth = s * 0.2; g.lineCap = "round";
  g.beginPath(); g.moveTo(-s * 0.85, s * 0.1); g.lineTo(-s * 1.35, s * 0.3); g.stroke();
  /* head */
  g.fillStyle = "#7a5c44";
  g.beginPath(); g.arc(s * 0.92, -s * 0.24, s * 0.42, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.66, -s * 0.6, s * 0.13, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 1.18, -s * 0.6, s * 0.13, 0, 7); g.fill();
  g.fillStyle = "#f0dcc6";
  g.beginPath(); g.ellipse(s * 1.06, -s * 0.12, s * 0.19, s * 0.14, 0, 0, 7); g.fill();
  g.fillStyle = "#1d1410";
  g.beginPath(); g.arc(s * 0.78, -s * 0.3, s * 0.075, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 1.06, -s * 0.3, s * 0.075, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 1.04, -s * 0.17, s * 0.06, 0, 7); g.fill();
  g.restore();
}
function drawPuffin(c, t){
  const s = c.k.r, dive = c.react > 0 ? Math.sin(c.react * Math.PI) * s * 1.6 : 0;
  g.save(); g.translate(c.x, c.y + dive); g.scale(c.dir, 1);
  g.fillStyle = "#20242b";
  g.beginPath(); g.ellipse(0, 0, s * 0.85, s * 0.62, 0, 0, 7); g.fill();
  g.fillStyle = "#f2f4f6";
  g.beginPath(); g.ellipse(-s * 0.1, s * 0.12, s * 0.55, s * 0.42, 0, 0, 7); g.fill();
  g.fillStyle = "#20242b";
  g.beginPath(); g.arc(s * 0.72, -s * 0.3, s * 0.42, 0, 7); g.fill();
  g.fillStyle = "#f2f4f6";
  g.beginPath(); g.arc(s * 0.82, -s * 0.26, s * 0.3, 0, 7); g.fill();
  g.fillStyle = "#ff8a2b";
  g.beginPath();
  g.moveTo(s * 1.02, -s * 0.44); g.lineTo(s * 1.62, -s * 0.2); g.lineTo(s * 1.0, s * 0.02);
  g.closePath(); g.fill();
  g.strokeStyle = "#d9481f"; g.lineWidth = s * 0.05;
  g.beginPath(); g.moveTo(s * 1.16, -s * 0.38); g.lineTo(s * 1.2, s * 0.0); g.stroke();
  g.fillStyle = "#1d1410";
  g.beginPath(); g.arc(s * 0.86, -s * 0.36, s * 0.08, 0, 7); g.fill();
  g.fillStyle = "#ff8a2b";
  g.beginPath(); g.ellipse(-s * 0.2, s * 0.56, s * 0.2, s * 0.1, 0, 0, 7); g.fill();
  g.restore();
}
function drawSeal(c, t){
  const s = c.k.r, wig = Math.sin(t * 2.4 + c.seed) * 0.1;
  g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1); g.rotate(wig * 0.3 + c.spin);
  g.fillStyle = "#8e9aa6";
  g.beginPath(); g.ellipse(0, 0, s * 1.05, s * 0.5, 0, 0, 7); g.fill();
  g.fillStyle = "#aab6c2";
  g.beginPath(); g.ellipse(0, s * 0.14, s * 0.8, s * 0.3, 0, 0, 7); g.fill();
  g.fillStyle = "#7c8894";
  for(let i = 0; i < 7; i++){
    g.beginPath();
    g.arc(-s * 0.7 + i * s * 0.24, -s * 0.16 + Math.sin(i * 2) * s * 0.14, s * 0.07, 0, 7);
    g.fill();
  }
  g.fillStyle = "#8e9aa6";
  g.beginPath(); g.arc(s * 0.95, -s * 0.16, s * 0.36, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-s * 0.95, 0); g.lineTo(-s * 1.5, -s * 0.3); g.lineTo(-s * 1.5, s * 0.3); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(-s * 0.1, s * 0.42, s * 0.34, s * 0.14, wig, 0, 7); g.fill();
  g.fillStyle = "#1d1410";
  g.beginPath(); g.arc(s * 0.88, -s * 0.24, s * 0.08, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 1.18, -s * 0.1, s * 0.07, 0, 7); g.fill();
  g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = s * 0.03;
  for(let i = -1; i <= 1; i++){
    g.beginPath(); g.moveTo(s * 1.1, -s * 0.02); g.lineTo(s * 1.5, i * s * 0.16); g.stroke();
  }
  g.restore();
}
function drawOctopus(c, t){
  const s = c.k.r;
  g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1);
  g.strokeStyle = c.react > 0 ? "#e88ccd" : "#9c4f86";
  g.lineWidth = s * 0.17; g.lineCap = "round";
  for(let i = 0; i < 8; i++){
    const a = -0.15 + i * 0.16, w = Math.sin(t * 2.6 + i * 0.8 + c.seed) * s * 0.28;
    g.beginPath();
    g.moveTo(-s * 0.6 + i * s * 0.17, s * 0.2);
    g.quadraticCurveTo(-s * 0.7 + i * s * 0.18 + w, s * 0.75, -s * 0.8 + i * s * 0.2 + w * 1.5, s * 1.15);
    g.stroke();
  }
  g.fillStyle = c.react > 0 ? "#e88ccd" : "#b4629b";
  g.beginPath(); g.ellipse(0, -s * 0.12, s * 0.78, s * 0.72, 0, 0, 7); g.fill();
  g.fillStyle = "#fff";
  g.beginPath(); g.arc(-s * 0.26, -s * 0.18, s * 0.2, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.26, -s * 0.18, s * 0.2, 0, 7); g.fill();
  g.fillStyle = "#1d1410";
  const look = Math.sin(t * 0.9 + c.seed) * s * 0.06;
  g.beginPath(); g.arc(-s * 0.26 + look, -s * 0.16, s * 0.1, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.26 + look, -s * 0.16, s * 0.1, 0, 7); g.fill();
  g.restore();
}
function drawJelly(c, t){
  const s = c.k.r;
  const pulse = 1 + Math.sin(t * 2.2 + c.seed) * 0.14 + c.react * 0.35;
  g.save(); g.translate(c.x, c.y);
  g.globalAlpha = 0.85;
  g.strokeStyle = c.react > 0 ? "rgba(255,240,255,.95)" : "rgba(232,183,255,.7)";
  g.lineWidth = s * 0.1; g.lineCap = "round";
  for(let i = -3; i <= 3; i++){
    const w = Math.sin(t * 2 + i + c.seed) * s * 0.2;
    g.beginPath();
    g.moveTo(i * s * 0.17, s * 0.3);
    g.quadraticCurveTo(i * s * 0.2 + w, s * 0.85, i * s * 0.22 + w * 1.6, s * 1.35);
    g.stroke();
  }
  const grd = g.createRadialGradient(0, -s * 0.1, s * 0.1, 0, 0, s * pulse);
  grd.addColorStop(0, c.react > 0 ? "rgba(255,255,255,.95)" : "rgba(255,230,255,.8)");
  grd.addColorStop(1, "rgba(200,130,240,.25)");
  g.fillStyle = grd;
  g.beginPath();
  g.ellipse(0, 0, s * 0.95 * pulse, s * 0.7 * pulse, 0, Math.PI, 0);
  g.quadraticCurveTo(0, s * 0.5 * pulse, -s * 0.95 * pulse, 0);
  g.fill();
  g.globalAlpha = 1;
  g.restore();
}
function drawSeaLion(c, t){
  const s = c.k.r, wig = Math.sin(t * 2 + c.seed) * 0.12;
  g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1); g.rotate(c.spin);
  g.fillStyle = "#9a6f49";
  g.beginPath(); g.ellipse(0, 0, s * 1.0, s * 0.46, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-s * 0.9, 0); g.lineTo(-s * 1.45, -s * 0.34); g.lineTo(-s * 1.4, s * 0.3); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(-s * 0.05, s * 0.4, s * 0.42, s * 0.15, wig, 0, 7); g.fill();
  g.beginPath(); g.ellipse(s * 0.2, -s * 0.34, s * 0.34, s * 0.13, -wig, 0, 7); g.fill();
  /* neck and head held up, which is the sea lion tell */
  g.beginPath();
  g.moveTo(s * 0.5, -s * 0.2);
  g.quadraticCurveTo(s * 1.0, -s * 0.55, s * 1.05, -s * 0.85);
  g.lineTo(s * 0.6, -s * 0.72);
  g.quadraticCurveTo(s * 0.6, -s * 0.4, s * 0.35, -s * 0.14);
  g.closePath(); g.fill();
  g.beginPath(); g.arc(s * 1.02, -s * 0.95, s * 0.3, 0, 7); g.fill();
  g.beginPath(); g.ellipse(s * 1.32, -s * 0.92, s * 0.16, s * 0.11, 0, 0, 7); g.fill();
  g.fillStyle = "#6d4c31";
  g.beginPath(); g.ellipse(s * 0.84, -s * 1.16, s * 0.07, s * 0.11, 0.4, 0, 7); g.fill();
  g.fillStyle = "#1d1410";
  g.beginPath(); g.arc(s * 1.08, -s * 1.02, s * 0.07, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 1.44, -s * 0.92, s * 0.055, 0, 7); g.fill();
  g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = s * 0.028;
  for(let i = -1; i <= 1; i++){
    g.beginPath(); g.moveTo(s * 1.34, -s * 0.86); g.lineTo(s * 1.72, -s * 0.86 + i * s * 0.14); g.stroke();
  }
  g.restore();
}
function drawSeaStar(c, t){
  const s = c.k.r, curl = c.react;
  g.save(); g.translate(c.x, c.y); g.rotate(Math.sin(t * 0.5 + c.seed) * 0.1);
  g.fillStyle = "#e2652c";
  g.beginPath();
  for(let i = 0; i < 5; i++){
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const a2 = a + Math.PI / 5;
    const outer = s * (1 - curl * 0.32);
    g.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    g.quadraticCurveTo(Math.cos(a2) * s * 0.28, Math.sin(a2) * s * 0.28,
                       Math.cos(a2) * s * 0.42, Math.sin(a2) * s * 0.42);
  }
  g.closePath(); g.fill();
  g.fillStyle = "#f5a068";
  for(let i = 0; i < 5; i++){
    const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
    for(let j = 1; j <= 3; j++){
      const d = s * (0.3 + j * 0.2) * (1 - curl * 0.32);
      g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, s * 0.06, 0, 7); g.fill();
    }
  }
  g.restore();
}
function drawCrab(c, t){
  const s = c.k.r, snap = c.react;
  g.save(); g.translate(c.x, c.y); g.scale(c.dir, 1);
  g.strokeStyle = "#b83a29"; g.lineWidth = s * 0.11; g.lineCap = "round";
  for(let i = -1; i <= 1; i++){
    const step = Math.sin(t * 7 + i * 2 + c.seed) * s * 0.14;
    g.beginPath(); g.moveTo(i * s * 0.35, s * 0.2); g.lineTo(i * s * 0.5 - s * 0.35, s * 0.66 + step); g.stroke();
    g.beginPath(); g.moveTo(i * s * 0.35, s * 0.2); g.lineTo(i * s * 0.5 + s * 0.35, s * 0.66 - step); g.stroke();
  }
  g.fillStyle = "#e2503c";
  g.beginPath(); g.ellipse(0, 0, s * 0.9, s * 0.6, 0, 0, 7); g.fill();
  const ca = snap * 0.7;
  [[-1, -ca], [1, ca]].forEach(cl => {
    g.save();
    g.translate(cl[0] * s * 0.95, -s * 0.25);
    g.rotate(cl[1]);
    g.fillStyle = "#c93f2c";
    g.beginPath(); g.ellipse(cl[0] * s * 0.3, 0, s * 0.36, s * 0.24, 0, 0, 7); g.fill();
    g.beginPath();
    g.moveTo(cl[0] * s * 0.5, -s * 0.1);
    g.lineTo(cl[0] * s * 0.95, -s * 0.28 - snap * s * 0.2);
    g.lineTo(cl[0] * s * 0.62, s * 0.04);
    g.closePath(); g.fill();
    g.restore();
  });
  g.fillStyle = "#fff";
  g.beginPath(); g.arc(-s * 0.22, -s * 0.42, s * 0.16, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.22, -s * 0.42, s * 0.16, 0, 7); g.fill();
  g.fillStyle = "#1d1410";
  g.beginPath(); g.arc(-s * 0.22, -s * 0.44, s * 0.08, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.22, -s * 0.44, s * 0.08, 0, 7); g.fill();
  g.restore();
}
const DRAW = {
  "sea-otter": drawSeaOtter, "puffin": drawPuffin, "harbor-seal": drawSeal,
  "octopus": drawOctopus, "jellyfish": drawJelly, "sea-lion": drawSeaLion,
  "sea-star": drawSeaStar, "crab": drawCrab
};

/* ---------------- scene ---------------- */
let kelp = [];
function seedKelp(){
  kelp = [];
  for(let i = 0; i < 9; i++){
    kelp.push({ x: rnd(0, 1), h: rnd(0.3, 0.62), w: rnd(7, 16), p: rnd(0, 6) });
  }
}
seedKelp();

function drawWater(t){
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#0e7f96");
  grd.addColorStop(0.35, "#0a5f79");
  grd.addColorStop(0.78, "#063d52");
  grd.addColorStop(1, "#052e3d");
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  /* light shafts from the surface */
  g.save();
  g.globalCompositeOperation = "lighter";
  for(let i = 0; i < 5; i++){
    const x = (i / 5) * W + Math.sin(t * 0.25 + i) * 40;
    g.globalAlpha = 0.05 + Math.sin(t * 0.5 + i) * 0.02;
    g.fillStyle = "#bdf0ff";
    g.beginPath();
    g.moveTo(x, 0); g.lineTo(x + 52, 0); g.lineTo(x + 150, H); g.lineTo(x - 40, H);
    g.closePath(); g.fill();
  }
  g.restore();
  g.globalAlpha = 1;

  /* surface */
  g.fillStyle = "rgba(190,244,255,.22)";
  g.beginPath();
  g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, surfaceY());
  for(let x = W; x >= 0; x -= 14){
    g.lineTo(x, surfaceY() + Math.sin(x / 40 + t * 1.4) * 5);
  }
  g.closePath(); g.fill();
}
function drawFloor(t){
  const sy = sandY();
  kelp.forEach(k => {
    const x = k.x * W, h = k.h * H;
    g.strokeStyle = "#1c6b4f"; g.lineWidth = k.w; g.lineCap = "round";
    g.beginPath();
    g.moveTo(x, sy);
    for(let i = 1; i <= 4; i++){
      const yy = sy - (h / 4) * i;
      g.lineTo(x + Math.sin(t * 0.8 + k.p + i * 0.7) * 16 * i / 4, yy);
    }
    g.stroke();
  });
  g.fillStyle = "#d9c08e";
  g.beginPath();
  g.moveTo(0, H); g.lineTo(0, sy);
  for(let x = 0; x <= W; x += 26) g.lineTo(x, sy + Math.sin(x / 90) * 7);
  g.lineTo(W, H); g.closePath(); g.fill();
  g.fillStyle = "rgba(0,0,0,.07)";
  for(let i = 0; i < 26; i++){
    const x = (i * 137) % W, y = sy + 14 + (i * 53) % Math.max(10, (H - sy - 20));
    g.beginPath(); g.ellipse(x, y, 10, 3, 0, 0, 7); g.fill();
  }
}

function frame(ms){
  const t = ms / 1000;
  drawWater(t);
  drawFloor(t);

  inks = inks.filter(k => k.life > 0);
  inks.forEach(k => {
    k.life -= 0.008; k.r += 1.1; k.y -= 0.25;
    g.globalAlpha = Math.max(0, k.life) * 0.55;
    g.fillStyle = "#1a1030";
    g.beginPath(); g.arc(k.x, k.y, k.r, 0, 7); g.fill();
    g.globalAlpha = 1;
  });

  critters.forEach(c => {
    if(c.react > 0) c.react = Math.max(0, c.react - 0.016);
    if(c.spin !== 0){
      c.spin += 0.22;
      if(c.spin >= Math.PI * 2){ c.spin = 0; }
    }
    /* drift toward a wander target, then pick a new one */
    const dx = c.tx - c.x, dy = c.ty - c.y;
    const d = Math.hypot(dx, dy);
    if(d < 22){
      c.tx = rnd(W * 0.1, W * 0.9);
      if(c.k.zone === "mid") c.ty = rnd(surfaceY() + 70, sandY() - 50);
      else if(c.k.zone === "top") c.ty = surfaceY() + rnd(6, 34);
      else c.ty = sandY() - rnd(2, 16);
    } else {
      c.x += (dx / d) * c.sp * (1 + c.react * 3);
      c.y += (dy / d) * c.sp * 0.6;
      if(Math.abs(dx) > 8) c.dir = dx > 0 ? 1 : -1;
    }
    if(c.k.zone === "top") c.y += Math.sin(t * 1.6 + c.seed) * 0.5;
    DRAW[c.k.id](c, t);
  });

  bubbles = bubbles.filter(b => b.y > -20);
  bubbles.forEach(b => {
    b.y -= b.v; b.x += Math.sin(t * 2 + b.p) * 0.5;
    g.strokeStyle = "rgba(220,250,255,.5)"; g.lineWidth = 1.4;
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke();
  });
  if(Math.random() < 0.13) bubbles.push({ x: rnd(0, W), y: H + 10, r: rnd(2, 7), v: rnd(0.5, 1.5), p: rnd(0, 6) });

  rings = rings.filter(r => r.life > 0);
  rings.forEach(r => {
    r.life -= 0.03; r.r += 3.4;
    g.globalAlpha = Math.max(0, r.life) * 0.6;
    g.strokeStyle = "#dffaff"; g.lineWidth = 2.5;
    g.beginPath(); g.arc(r.x, r.y, r.r, 0, 7); g.stroke();
    g.globalAlpha = 1;
  });

  requestAnimationFrame(frame);
}

function poke(x, y){
  let hit = null, best = 1e9;
  critters.forEach(c => {
    const d = Math.hypot(c.x - x, c.y - y);
    if(d < c.k.r * 1.5 && d < best){ best = d; hit = c; }
  });
  if(hit){
    hit.react = 1;
    say(hit.k.id);
    if(hit.k.id === "octopus"){
      inks.push({ x: hit.x, y: hit.y, r: hit.k.r * 0.6, life: 1 });
      bloop(false);
    } else if(hit.k.id === "sea-otter" || hit.k.id === "harbor-seal" || hit.k.id === "sea-lion"){
      hit.spin = 0.01; splash();
    } else {
      bloop(true);
    }
    for(let i = 0; i < 8; i++){
      bubbles.push({ x: hit.x + rnd(-20, 20), y: hit.y, r: rnd(2, 6), v: rnd(0.8, 2), p: rnd(0, 6) });
    }
  } else {
    rings.push({ x: x, y: y, r: 6, life: 1 });
    /* appear right where the finger landed, but at a depth that suits the animal */
    const k = KINDS[(Math.random() * KINDS.length) | 0];
    let yy = y;
    if(k.zone === "top") yy = surfaceY() + rnd(6, 34);
    else if(k.zone === "floor") yy = sandY() - rnd(2, 16);
    else yy = Math.max(surfaceY() + 70, Math.min(sandY() - 50, y));
    spawn(k, Math.max(40, Math.min(W - 40, x)), yy);
    for(let i = 0; i < 12; i++){
      bubbles.push({ x: x + rnd(-26, 26), y: yy + rnd(-10, 20), r: rnd(2, 7), v: rnd(0.8, 2.2), p: rnd(0, 6) });
    }
    splash();
  }
}

const gate = document.getElementById("gate");
gate.addEventListener("pointerdown", e => {
  boot();
  gate.classList.add("gone");
  spawn(KINDS[0]); spawn(KINDS[4]); spawn(KINDS[6]);
  e.preventDefault();
});
window.addEventListener("pointerdown", e => {
  if(!gate.classList.contains("gone")) return;
  if(e.target.classList && e.target.classList.contains("home")) return;
  poke(e.clientX, e.clientY);
}, { passive: true });

resize();
requestAnimationFrame(frame);
</script>
</body>
