<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Snow Palace</title>
<meta name="description" content="Make it snow, draw frost on the window, and change the snow queen's dress.">
<meta name="theme-color" content="#0a1030">
<style>
  html{color-scheme:dark;height:100%}
  body{
    margin:0;height:100%;background:#0a1030;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}
  .home{
    position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:3;
    width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);
    color:rgba(255,255,255,.5);text-decoration:none;font-size:19px;line-height:34px;text-align:center;
  }
  .gate{
    position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(circle at 50% 40%, #1b2a63 0%, #0a1030 72%);
    color:#fff;cursor:pointer;
  }
  .gate.gone{display:none}
  .gate h1{font-size:clamp(32px,10vw,56px);margin:0;font-weight:800;letter-spacing:-.02em}
  .gate p{margin:0;color:#a8bde8;font-size:17px}
  .gate svg{width:min(44vw,180px);height:auto}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<a class="home" href="../toys.html" aria-label="Back to toys">&#8592;</a>

<div class="gate" id="gate">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <g stroke="#bfe3ff" stroke-width="5" stroke-linecap="round">
      <path d="M60 14 V106 M22 36 L98 84 M98 36 L22 84"/>
      <path d="M60 24 l-9 9 M60 24 l9 9 M60 96 l-9 -9 M60 96 l9 -9"/>
      <path d="M31 41 l1 13 M31 41 l12 -2 M89 79 l-1 -13 M89 79 l-12 2"/>
      <path d="M89 41 l-12 -2 M89 41 l-1 13 M31 79 l12 2 M31 79 l1 -13"/>
    </g>
  </svg>
  <h1>Snow Palace</h1>
  <p>Tap to make it snow</p>
</div>

<script>
"use strict";

/* ---------------- sound ---------------- */
let AC = null, bus = null, last = 0;
const BELLS = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
function boot(){
  if(AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  bus = AC.createGain(); bus.gain.value = 0.45; bus.connect(AC.destination);
}
function bell(f, vol){
  if(!AC) return;
  const t = AC.currentTime;
  if(t - last < 0.05) return;
  last = t;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), g2 = AC.createGain();
  o.type = "sine"; o.frequency.value = f;
  o2.type = "sine"; o2.frequency.value = f * 2.76;     /* inharmonic partial = bell, not beep */
  g2.gain.value = 0.18;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus);
  o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
}
function shimmer(){
  [0, 90, 180, 300].forEach((d, i) => setTimeout(() => bell(BELLS[i + 2] * 2, 0.12), d));
}

/* ---------------- canvas ---------------- */
const cv = document.getElementById("cv"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  frost.length = 0;
  drift = new Array(64).fill(0);
}
window.addEventListener("resize", resize);

const rnd = (a, b) => a + Math.random() * (b - a);
let flakes = [], frost = [], drift = new Array(64).fill(0), sparkles = [];

/* the queen */
const DRESSES = [
  { body: "#7fd4ff", trim: "#e8f7ff", cape: "#bfe9ff" },
  { body: "#c9a7ff", trim: "#f3e9ff", cape: "#e0cbff" },
  { body: "#ff9ecb", trim: "#ffe9f4", cape: "#ffc6e2" },
  { body: "#9ef0c9", trim: "#e9fff5", cape: "#c6f6e0" },
  { body: "#ffd88a", trim: "#fff5e0", cape: "#ffe9bc" },
  { body: "#a8b6ff", trim: "#ecefff", cape: "#cdd6ff" }
];
let dressIdx = 0, twirl = 0, hair = 0;

function queenBox(){
  const s = Math.min(W, H) * 0.30;
  return { x: W / 2, y: H * 0.80, s: s };
}
function drawQueen(t){
  const q = queenBox(), s = q.s, d = DRESSES[dressIdx];
  const sway = Math.sin(t * 1.2) * 0.03 + twirl * 0.5;
  g.save();
  g.translate(q.x, q.y);
  g.rotate(sway);

  /* cape */
  g.fillStyle = d.cape; g.globalAlpha = 0.55;
  g.beginPath();
  g.moveTo(-s * 0.12, -s * 0.70);
  g.bezierCurveTo(-s * 0.10, -s * 0.40, -s * 0.20, -s * 0.10, -s * 0.30, s * 0.06);
  g.lineTo(s * 0.30, s * 0.06);
  g.bezierCurveTo(s * 0.20, -s * 0.10, s * 0.10, -s * 0.40, s * 0.12, -s * 0.70);
  g.closePath(); g.fill();
  g.globalAlpha = 1;

  /* gown */
  g.fillStyle = d.body;
  g.beginPath();
  g.moveTo(-s * 0.11, -s * 0.62);
  g.bezierCurveTo(-s * 0.09, -s * 0.40, -s * 0.13, -s * 0.14, -s * 0.24, s * 0.02);
  g.quadraticCurveTo(0, s * 0.10, s * 0.24, s * 0.02);
  g.bezierCurveTo(s * 0.13, -s * 0.14, s * 0.09, -s * 0.40, s * 0.11, -s * 0.62);
  g.closePath(); g.fill();
  g.fillStyle = d.trim;
  g.beginPath();
  g.moveTo(-s * 0.24, s * 0.02); g.quadraticCurveTo(0, s * 0.10, s * 0.24, s * 0.02);
  g.quadraticCurveTo(0, s * 0.04, -s * 0.24, s * 0.02);
  g.fill();

  /* arms */
  g.strokeStyle = d.body; g.lineWidth = s * 0.055; g.lineCap = "round";
  g.beginPath(); g.moveTo(-s * 0.10, -s * 0.58); g.quadraticCurveTo(-s * 0.18, -s * 0.44, -s * 0.15, -s * 0.24); g.stroke();
  g.beginPath(); g.moveTo(s * 0.10, -s * 0.58); g.quadraticCurveTo(s * 0.18, -s * 0.44, s * 0.15, -s * 0.24); g.stroke();

  /* head */
  g.fillStyle = "#f7d9c4";
  g.beginPath(); g.arc(0, -s * 0.82, s * 0.17, 0, 7); g.fill();
  /* braid, swinging */
  g.strokeStyle = "#f0e2b8"; g.lineWidth = s * 0.09;
  g.beginPath();
  g.moveTo(s * 0.08, -s * 0.82);
  g.quadraticCurveTo(s * 0.20 + hair * s * 0.06, -s * 0.60, s * 0.14 + hair * s * 0.08, -s * 0.32);
  g.stroke();
  g.fillStyle = "#f0e2b8";
  g.beginPath(); g.arc(0, -s * 0.92, s * 0.18, Math.PI, 0); g.fill();

  /* face */
  g.fillStyle = "#3a2b34";
  g.beginPath(); g.arc(-s * 0.06, -s * 0.83, s * 0.018, 0, 7); g.fill();
  g.beginPath(); g.arc(s * 0.06, -s * 0.83, s * 0.018, 0, 7); g.fill();
  g.strokeStyle = "#d98da0"; g.lineWidth = s * 0.014;
  g.beginPath(); g.arc(0, -s * 0.79, s * 0.05, 0.3, Math.PI - 0.3); g.stroke();

  /* crown */
  g.fillStyle = "#fff3b0";
  g.beginPath();
  g.moveTo(-s * 0.14, -s * 0.98);
  g.lineTo(-s * 0.09, -s * 1.10); g.lineTo(-s * 0.04, -s * 1.0);
  g.lineTo(0, -s * 1.14); g.lineTo(s * 0.04, -s * 1.0);
  g.lineTo(s * 0.09, -s * 1.10); g.lineTo(s * 0.14, -s * 0.98);
  g.closePath(); g.fill();
  g.restore();
}

/* ---------------- scene ---------------- */
function drawSky(t){
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#070c26");
  grd.addColorStop(0.45, "#122051");
  grd.addColorStop(1, "#2b3f7a");
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  /* aurora — this is Alaska, after all */
  for(let b = 0; b < 3; b++){
    g.beginPath();
    const base = H * (0.16 + b * 0.07);
    for(let x = 0; x <= W; x += 12){
      const y = base + Math.sin(x / 150 + t * 0.35 + b) * 26 + Math.sin(x / 47 - t * 0.2) * 9;
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    for(let x = W; x >= 0; x -= 12){
      const y = base + 58 + Math.sin(x / 130 + t * 0.3 + b) * 22;
      g.lineTo(x, y);
    }
    g.closePath();
    const gg = g.createLinearGradient(0, base - 30, 0, base + 70);
    gg.addColorStop(0, "rgba(120,255,200,0)");
    gg.addColorStop(0.5, b === 1 ? "rgba(150,190,255,0.16)" : "rgba(110,255,190,0.15)");
    gg.addColorStop(1, "rgba(190,140,255,0)");
    g.fillStyle = gg; g.fill();
  }

  /* palace */
  const py = H * 0.80, pw = Math.min(W * 0.9, 620);
  g.fillStyle = "rgba(150,190,255,0.30)";
  const towers = [[-0.42, 0.30], [-0.24, 0.46], [0, 0.62], [0.24, 0.46], [0.42, 0.30]];
  towers.forEach(tw => {
    const x = W / 2 + tw[0] * pw, w = pw * 0.13, h = H * tw[1] * 0.55;
    g.fillRect(x - w / 2, py - h, w, h);
    g.beginPath();
    g.moveTo(x - w / 2 - 4, py - h); g.lineTo(x, py - h - w * 0.85); g.lineTo(x + w / 2 + 4, py - h);
    g.closePath(); g.fill();
  });
}
function drawGround(){
  const gy = H * 0.80;
  g.fillStyle = "#dfeaff";
  g.beginPath();
  g.moveTo(0, H);
  g.lineTo(0, gy + 8);
  for(let i = 0; i < drift.length; i++){
    g.lineTo(i / (drift.length - 1) * W, gy + 8 - drift[i]);
  }
  g.lineTo(W, H);
  g.closePath(); g.fill();
}

function frame(ms){
  const t = ms / 1000;
  drawSky(t);

  /* frost strokes sit behind the snow */
  frost.forEach(f => {
    f.life -= 0.0016;
    if(f.life <= 0) return;
    g.globalAlpha = Math.max(0, f.life) * 0.9;
    g.strokeStyle = "#cfe8ff"; g.lineCap = "round";
    g.lineWidth = f.w;
    g.beginPath(); g.moveTo(f.x1, f.y1); g.lineTo(f.x2, f.y2); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = f.w * 0.3;
    g.beginPath(); g.moveTo(f.x1, f.y1); g.lineTo(f.x2, f.y2); g.stroke();
    g.globalAlpha = 1;
  });
  frost = frost.filter(f => f.life > 0);

  drawQueen(t);
  drawGround();

  flakes.forEach(f => {
    f.y += f.vy; f.x += Math.sin(t * f.sw + f.p) * 0.7;
    f.spin += 0.02;
    if(f.y > H * 0.80 + 6 - drift[Math.min(drift.length - 1, Math.max(0, Math.floor(f.x / W * drift.length)))]){
      const i = Math.min(drift.length - 1, Math.max(0, Math.floor(f.x / W * drift.length)));
      if(drift[i] < H * 0.11) drift[i] += 0.5;
      /* soften the pile so it does not turn into spikes */
      if(i > 0) drift[i - 1] += 0.16;
      if(i < drift.length - 1) drift[i + 1] += 0.16;
      f.dead = true;
      return;
    }
    g.save(); g.translate(f.x, f.y); g.rotate(f.spin);
    g.strokeStyle = "rgba(255,255,255," + f.a + ")";
    g.lineWidth = Math.max(1, f.r * 0.34); g.lineCap = "round";
    for(let a = 0; a < 3; a++){
      g.rotate(Math.PI / 3);
      g.beginPath(); g.moveTo(-f.r, 0); g.lineTo(f.r, 0); g.stroke();
    }
    g.restore();
  });
  flakes = flakes.filter(f => !f.dead);
  if(flakes.length > 420) flakes.splice(0, flakes.length - 420);

  sparkles.forEach(s => {
    s.life -= 0.022; s.x += s.vx; s.y += s.vy; s.vy += 0.06;
    g.globalAlpha = Math.max(0, s.life);
    g.fillStyle = s.col;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill();
    g.globalAlpha = 1;
  });
  sparkles = sparkles.filter(s => s.life > 0);

  if(twirl !== 0) twirl *= 0.9;
  hair = Math.sin(t * 1.6) * 0.5;

  requestAnimationFrame(frame);
}

function snowAt(x, y, n){
  for(let i = 0; i < n; i++){
    flakes.push({
      x: x + rnd(-34, 34), y: y + rnd(-26, 10),
      vy: rnd(0.6, 2.0), r: rnd(3, 9), a: rnd(0.55, 1), sw: rnd(0.6, 1.8), p: rnd(0, 6), spin: rnd(0, 6)
    });
  }
}
function hitQueen(x, y){
  const q = queenBox();
  return Math.abs(x - q.x) < q.s * 0.55 && y > q.y - q.s * 1.2 && y < q.y + q.s * 0.2;
}

const gate = document.getElementById("gate");
gate.addEventListener("pointerdown", e => { boot(); gate.classList.add("gone"); e.preventDefault(); });

const drags = new Map();
window.addEventListener("pointerdown", e => {
  if(!gate.classList.contains("gone")) return;
  if(e.target.classList && e.target.classList.contains("home")) return;
  const x = e.clientX, y = e.clientY;
  drags.set(e.pointerId, { x: x, y: y });
  if(hitQueen(x, y)){
    dressIdx = (dressIdx + 1) % DRESSES.length;
    twirl = 0.5; shimmer();
    const d = DRESSES[dressIdx];
    for(let i = 0; i < 26; i++){
      const a = Math.random() * Math.PI * 2, sp = rnd(1, 6);
      sparkles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                      r: rnd(2, 5), col: i % 2 ? "#ffffff" : d.trim, life: 1 });
    }
  } else {
    snowAt(x, y, 16);
    bell(BELLS[Math.floor(Math.random() * BELLS.length)], 0.18);
  }
}, { passive: true });

window.addEventListener("pointermove", e => {
  const last = drags.get(e.pointerId);
  if(!last) return;
  const x = e.clientX, y = e.clientY;
  const d = Math.hypot(x - last.x, y - last.y);
  if(d < 4) return;
  frost.push({ x1: last.x, y1: last.y, x2: x, y2: y, w: rnd(4, 9), life: 1 });
  if(frost.length > 260) frost.shift();
  if(Math.random() < 0.5) snowAt(x, y, 1);
  if(d > 20) bell(BELLS[Math.floor(Math.random() * BELLS.length)] * 2, 0.07);
  drags.set(e.pointerId, { x: x, y: y });
}, { passive: true });

function end(e){ drags.delete(e.pointerId); }
window.addEventListener("pointerup", end, { passive: true });
window.addEventListener("pointercancel", end, { passive: true });

/* a gentle snowfall even when nobody is touching it */
setInterval(() => { if(flakes.length < 120) snowAt(Math.random() * W, -20, 2); }, 320);

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
